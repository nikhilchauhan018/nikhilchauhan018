<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#08172e"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#18304c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="520" rx="24" fill="url(#bg)"/>
  <rect width="900" height="520" rx="24" fill="url(#grid)" opacity=".45"/>

  <circle cx="760" cy="90" r="105" fill="none" stroke="#00e5ff" opacity=".15"/>
  <circle cx="760" cy="90" r="75" fill="none" stroke="#8b5cf6" opacity=".18"/>
  <circle cx="760" cy="90" r="45" fill="none" stroke="#00ff88" opacity=".2"/>

  <text x="42" y="52" fill="#00e5ff" font-family="monospace" font-size="20">
    nikhil@github:~$ ./developer_os
  </text>

  <rect x="42" y="82" width="816" height="380" rx="18" fill="#02050b" stroke="#17324d" stroke-width="2"/>

  <circle cx="70" cy="110" r="7" fill="#ff5f57"/>
  <circle cx="94" cy="110" r="7" fill="#ffbd2e"/>
  <circle cx="118" cy="110" r="7" fill="#28c840"/>

  <!-- Monitor -->
  <rect x="185" y="150" width="470" height="205" rx="12" fill="#07111e" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  <rect x="205" y="170" width="430" height="165" rx="6" fill="#02060c"/>

  <!-- code -->
  <text x="225" y="202" fill="#00ff88" font-family="monospace" font-size="16">const engineer = {</text>
  <text x="245" y="230" fill="#00e5ff" font-family="monospace" font-size="15">name: "Nikhil",</text>
  <text x="245" y="256" fill="#8b5cf6" font-family="monospace" font-size="15">role: "Full-Stack",</text>
  <text x="245" y="282" fill="#00e5ff" font-family="monospace" font-size="15">stack: ["React", "Node", "TS"],</text>
  <text x="225" y="310" fill="#00ff88" font-family="monospace" font-size="16">};</text>

  <!-- animated cursor -->
  <rect x="430" y="308" width="10" height="18" fill="#00ff88">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- monitor stand -->
  <path d="M390 355h60l18 34h-96z" fill="#101d2e"/>
  <rect x="355" y="389" width="130" height="8" rx="4" fill="#17324d"/>

  <!-- coder silhouette -->
  <circle cx="750" cy="260" r="35" fill="#0b1422" stroke="#00e5ff" stroke-width="2"/>
  <path d="M695 410c6-78 28-112 55-112s49 34 55 112z" fill="#0b1422" stroke="#8b5cf6" stroke-width="3"/>
  <path d="M716 244q34-45 68 0" fill="none" stroke="#00ff88" stroke-width="4"/>

  <!-- side status -->
  <rect x="62" y="150" width="105" height="205" rx="12" fill="#07111e" stroke="#17324d"/>
  <text x="78" y="180" fill="#ffffff" font-family="monospace" font-size="13">STATUS</text>
  <circle cx="82" cy="208" r="5" fill="#00ff88"/>
  <text x="95" y="213" fill="#9fb3c8" font-family="monospace" font-size="11">ONLINE</text>
  <circle cx="82" cy="238" r="5" fill="#00e5ff"/>
  <text x="95" y="243" fill="#9fb3c8" font-family="monospace" font-size="11">BUILD</text>
  <circle cx="82" cy="268" r="5" fill="#8b5cf6"/>
  <text x="95" y="273" fill="#9fb3c8" font-family="monospace" font-size="11">LEARN</text>
  <circle cx="82" cy="298" r="5" fill="#00ff88"/>
  <text x="95" y="303" fill="#9fb3c8" font-family="monospace" font-size="11">SHIP</text>

  <text x="62" y="430" fill="#00ff88" font-family="monospace" font-size="15">
    CODE • LEARN • BUILD • REPEAT
  </text>

  <text x="690" y="450" fill="#00e5ff" font-family="monospace" font-size="12">
    SYSTEM ONLINE
  </text>
</svg>
