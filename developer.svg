<svg width="600" height="380" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0A1638"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="barFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <linearGradient id="barBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="barDb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- window frame -->
  <rect x="2" y="2" width="596" height="376" rx="16" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="2" y="2" width="596" height="38" rx="16" fill="#0D1B33"/>
  <rect x="2" y="24" width="596" height="16" fill="#0D1B33"/>
  <circle cx="26" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="21" r="6" fill="#27C93F"/>
  <text x="300" y="26" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="13" fill="#8B9BB4">nikhil@github: ~/developer-os</text>

  <!-- terminal typed lines with reveal animation -->
  <g font-family="Consolas, Monaco, monospace" font-size="14" fill="#00FF88">
    <text x="24" y="70">
      <tspan fill="#00E5FF">nikhil@github</tspan><tspan fill="#8B9BB4">:~$ </tspan><tspan fill="#FFFFFF">./boot_dev_os.sh</tspan>
    </text>

    <g>
      <rect x="20" y="90" width="0" height="18" fill="#050816">
        <animate attributeName="width" from="0" to="560" dur="1.4s" begin="0s" fill="freeze"/>
      </rect>
      <clipPath id="clip1">
        <rect x="20" y="80" width="0" height="20">
          <animate attributeName="width" from="0" to="560" dur="1.4s" begin="0s" fill="freeze"/>
        </rect>
      </clipPath>
      <text x="24" y="95" fill="#FFD700" clip-path="url(#clip1)">&gt; Frontend Engine ......... ONLINE</text>
    </g>

    <g>
      <clipPath id="clip2">
        <rect x="20" y="105" width="0" height="20">
          <animate attributeName="width" from="0" to="560" dur="1.4s" begin="1.4s" fill="freeze"/>
        </rect>
      </clipPath>
      <text x="24" y="120" fill="#00E5FF" clip-path="url(#clip2)">&gt; Backend Engine .......... ONLINE</text>
    </g>

    <g>
      <clipPath id="clip3">
        <rect x="20" y="130" width="0" height="20">
          <animate attributeName="width" from="0" to="560" dur="1.4s" begin="2.8s" fill="freeze"/>
        </rect>
      </clipPath>
      <text x="24" y="145" fill="#FF0080" clip-path="url(#clip3)">&gt; Database Layer .......... ONLINE</text>
    </g>

    <g>
      <clipPath id="clip4">
        <rect x="20" y="155" width="0" height="20">
          <animate attributeName="width" from="0" to="560" dur="1.4s" begin="4.2s" fill="freeze"/>
        </rect>
      </clipPath>
      <text x="24" y="170" fill="#8B5CF6" clip-path="url(#clip4)">&gt; DevOps Pipeline ......... BUILDING</text>
    </g>

    <!-- blinking cursor -->
    <rect x="24" y="178" width="9" height="15" fill="#00FF88">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1s" begin="5.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- divider -->
  <line x1="20" y1="205" x2="580" y2="205" stroke="#1E3A5F" stroke-width="1"/>

  <!-- status bars -->
  <g font-family="Consolas, Monaco, monospace" font-size="13">
    <text x="24" y="230" fill="#FFFFFF">FRONTEND</text>
    <rect x="140" y="218" width="420" height="14" rx="7" fill="#111C34"/>
    <rect x="140" y="218" width="0" height="14" rx="7" fill="url(#barFront)">
      <animate attributeName="width" from="0" to="404" dur="1.6s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="580" y="230" text-anchor="end" fill="#00FF88" font-weight="bold">96%</text>

    <text x="24" y="258" fill="#FFFFFF">BACKEND</text>
    <rect x="140" y="246" width="420" height="14" rx="7" fill="#111C34"/>
    <rect x="140" y="246" width="0" height="14" rx="7" fill="url(#barBack)">
      <animate attributeName="width" from="0" to="378" dur="1.6s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="580" y="258" text-anchor="end" fill="#FF0080" font-weight="bold">90%</text>

    <text x="24" y="286" fill="#FFFFFF">DATABASE</text>
    <rect x="140" y="274" width="420" height="14" rx="7" fill="#111C34"/>
    <rect x="140" y="274" width="0" height="14" rx="7" fill="url(#barDb)">
      <animate attributeName="width" from="0" to="357" dur="1.6s" begin="0.9s" fill="freeze"/>
    </rect>
    <text x="580" y="286" text-anchor="end" fill="#FFD700" font-weight="bold">85%</text>

    <text x="24" y="314" fill="#FFFFFF">DEVOPS</text>
    <rect x="140" y="302" width="420" height="14" rx="7" fill="#111C34"/>
    <rect x="140" y="302" width="0" height="14" rx="7" fill="#8B5CF6">
      <animate attributeName="width" from="0" to="210" dur="1.6s" begin="1.2s" fill="freeze"/>
    </rect>
    <text x="580" y="314" text-anchor="end" fill="#8B5CF6" font-weight="bold">50%</text>
  </g>

  <!-- pulsing online indicator -->
  <g transform="translate(24,340)">
    <circle cx="0" cy="0" r="5" fill="#00FF88" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" font-family="Consolas, Monaco, monospace" font-size="13" fill="#00FF88">SYSTEM ACTIVE — BUILDING · LEARNING · SHIPPING</text>
  </g>
</svg>
