<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0080"/>
      <stop offset="30%" stop-color="#FF8C00"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#050816" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="230" fill="#050816"/>
  <rect width="900" height="230" fill="url(#heroBg)" opacity="0.35"/>
  <rect width="900" height="230" fill="url(#vignette)"/>

  <!-- floating particles -->
  <g>
    <circle cx="80" cy="200" r="3" fill="#00E5FF">
      <animate attributeName="cy" values="200;20;200" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="210" r="2.2" fill="#FF0080">
      <animate attributeName="cy" values="210;10;210" dur="9s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="190" r="2.6" fill="#FFD700">
      <animate attributeName="cy" values="190;15;190" dur="6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="205" r="2.8" fill="#8B5CF6">
      <animate attributeName="cy" values="205;25;205" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="215" r="2.2" fill="#00FF88">
      <animate attributeName="cy" values="215;20;215" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="195" r="3" fill="#00E5FF">
      <animate attributeName="cy" values="195;10;195" dur="6.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="215" r="2.4" fill="#FF8C00">
      <animate attributeName="cy" values="215;15;215" dur="8.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="200" r="2" fill="#FFD700">
      <animate attributeName="cy" values="200;30;200" dur="7.2s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.2s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- glowing title -->
  <text x="450" y="105" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-weight="bold" font-size="42" fill="#FFFFFF" filter="url(#textGlow)">
    NIKHIL KUMAR CHAUHAN
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle -->
  <text x="450" y="140" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="18" fill="#00E5FF">
    Full-Stack Software Engineer
  </text>

  <!-- animated underline -->
  <rect x="350" y="155" width="0" height="3" fill="#FF0080">
    <animate attributeName="width" values="0;200;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;350;450" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="450" y="190" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="14" fill="#8B9BB4">
    React.js · Next.js · Node.js · TypeScript — Building Scalable Production-Ready Apps
  </text>
</svg>
