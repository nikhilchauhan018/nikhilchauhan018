name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"      # regenerate daily at midnight UTC
  workflow_dispatch:          # allow manual run from the Actions tab
  push:
    branches:
      - main                 # regenerate whenever main updates

concurrency:
  group: snake-generation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate themed contribution snake (dark + light + GIF)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00E5FF&color_dots=#0A1024,#1E3A5F,#00E5FF,#8B5CF6,#FF0080&color_dark_snake=#00E5FF&color_dark_dots=#0A1024,#1E3A5F,#00E5FF,#8B5CF6,#FF0080
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF0080&color_dots=#0A1024,#1E3A5F,#00E5FF,#8B5CF6,#FF0080
            dist/github-contribution-grid-snake.gif?color_snake=#00E5FF&color_dots=#0A1024,#1E3A5F,#00E5FF,#8B5CF6,#FF0080

      - name: Publish generated files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
